# XcodeGen 設定：brew install xcodegen && xcodegen generate → 開啟 CampusMatch.xcodeproj
name: CampusMatch
options:
  bundleIdPrefix: tw.edu.fcu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # 填入 Apple Developer Team ID（APNs / TestFlight 需要）
targets:
  CampusMatch:
    type: application
    platform: iOS
    sources: [CampusMatch]
    entitlements:
      path: CampusMatch/CampusMatch.entitlements
      properties:
        aps-environment: development
    info:
      path: CampusMatch/Info.plist
      properties:
        CFBundleDisplayName: 跨系媒合
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true     # Demo 允許 http://localhost；正式環境改用 https 並移除
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.edu.fcu.campusmatch
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
